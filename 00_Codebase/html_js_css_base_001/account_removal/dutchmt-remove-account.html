<!DOCTYPE HTML>
<!--
	Reign of Play – Dutch MT – Remove account
-->
<html>
	<head>
		<title>Remove account – Dutch MT - Reign of Play</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="description" content="Request account and data removal for Dutch MT." />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Header -->
		<header id="header">
			<a href="../index.html" class="title"><img src="../images/rop_logo.png" alt="Reign of Play" /></a>
			<nav>
				<ul>
					<li><a href="../index.html">Home</a></li>
					<li><a href="../index.html#one">The Games</a></li>
					<li><a href="../index.html#three">Get in touch</a></li>
					<li><a href="../dutchmt-card-game.html">Dutch MT</a></li>
				</ul>
			</nav>
		</header>

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<section id="main" class="wrapper">
				<div class="inner">
					<h1 class="major">Remove your Dutch MT account</h1>
					<p>Use this form to request deletion of your Dutch MT account and all associated data. This action cannot be undone.</p>

					<form method="post" action="#" id="dutchmt-remove-account-form">
						<div class="fields">
							<div class="field">
								<label for="email">Email</label>
								<input type="email" name="email" id="email" required />
							</div>
							<div class="field">
								<label for="password">Password</label>
								<input type="password" name="password" id="password" required />
							</div>
							<div class="field">
								<input type="checkbox" id="confirm-delete" name="confirm-delete" required />
								<label for="confirm-delete">Delete my account and all my data for Dutch MT</label>
							</div>
						</div>
						<ul class="actions">
							<li><button type="submit" class="button primary">Send request</button></li>
						</ul>
					</form>

					<p><a href="../dutchmt-card-game.html">Back to Dutch MT</a></p>
				</div>
			</section>

		</div>

		<!-- Footer -->
		<footer id="footer" class="wrapper alt">
			<div class="inner">
				<ul class="menu">
					<li>&copy; Reign of Play. All rights reserved.</li>
					<li><a href="../privacy_policy/dutchmt-privacy-policy.html">Privacy Policy</a></li>
					<li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
				</ul>
			</div>
		</footer>

		<!-- Scripts -->
		<script src="../assets/js/jquery.min.js"></script>
		<script src="../assets/js/jquery.scrollex.min.js"></script>
		<script src="../assets/js/jquery.scrolly.min.js"></script>
		<script src="../assets/js/browser.min.js"></script>
		<script src="../assets/js/breakpoints.min.js"></script>
		<script src="../assets/js/util.js"></script>
		<script src="../assets/js/main.js"></script>
		<script>
			// Send button not wired yet: prevent form submit until backend is ready
			document.getElementById('dutchmt-remove-account-form').addEventListener('submit', function (e) {
				e.preventDefault();
			});
		</script>

	</body>
</html>

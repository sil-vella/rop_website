# RoP website only — PHP backend + MariaDB (this project).
# Does not include main app containers (Flask, MongoDB, Redis, Grafana, Prometheus, Dart).
# Deploy to /opt/apps/reignofplay/rop_website on VPS.

services:
  rop_website_db:
    image: mariadb:11
    container_name: rop_website_db
    env_file:
      - .env.rop_website
    environment:
      - MARIADB_DATABASE=dutch_dashboard
    ports:
      - "3307:3306"
    volumes:
      - /opt/apps/reignofplay/rop_website/data/website_mysql:/var/lib/mysql
      - ./00_Codebase/php_base_001/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  rop_website_php:
    image: silvella/rop_website_php:latest
    container_name: rop_website_php
    env_file:
      - .env.rop_website
    ports:
      - "8081:80"
    environment:
      - DB_HOST=rop_website_db
      - DB_NAME=dutch_dashboard
    depends_on:
      rop_website_db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Dutch.mt Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script>window.DUTCH_DASHBOARD_API_BASE = window.DUTCH_DASHBOARD_API_BASE || '';</script>
</head>
<body>
  <div class="container">
    <h1>Dutch.mt Dashboard — Register</h1>
    <form id="register-form" class="card">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      <label for="password-confirm">Confirm password</label>
      <input type="password" id="password-confirm" name="password_confirm" required autocomplete="new-password" minlength="8">
      <div id="register-error" class="error" role="alert" aria-live="polite"></div>
      <div id="register-success" class="success" role="status" aria-live="polite"></div>
      <button type="submit">Register</button>
      <p class="form-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script>
    (function () {
      var form = document.getElementById('register-form');
      var errorEl = document.getElementById('register-error');
      var successEl = document.getElementById('register-success');

      function url(path) {
        var base = (typeof window.DUTCH_DASHBOARD_API_BASE !== 'undefined' && window.DUTCH_DASHBOARD_API_BASE) ? window.DUTCH_DASHBOARD_API_BASE.replace(/\/$/, '') : '';
        return base + (path.charAt(0) === '/' ? path : '/' + path);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.textContent = '';
        successEl.textContent = '';
        var username = document.getElementById('username').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var passwordConfirm = document.getElementById('password-confirm').value;

        if (!username || !email || !password) {
          errorEl.textContent = 'Please fill in all fields.';
          return;
        }
        if (password.length < 8) {
          errorEl.textContent = 'Password must be at least 8 characters.';
          return;
        }
        if (password !== passwordConfirm) {
          errorEl.textContent = 'Passwords do not match.';
          return;
        }

        fetch(url('/api/register.php'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, email: email, password: password })
        })
          .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (out) {
            if (out.ok && out.data && out.data.success) {
              successEl.textContent = out.data.message || 'Registered. Redirecting to sign in…';
              setTimeout(function () { window.location.href = 'login.html'; }, 1500);
            } else {
              errorEl.textContent = (out.data && out.data.error) || 'Registration failed.';
            }
          })
          .catch(function () {
            errorEl.textContent = 'Registration failed.';
          });
      });
    })();
  </script>
</body>
</html>
